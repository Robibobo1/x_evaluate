repositories:
  # X library fork with the event-based frontends (EKLT, HASTE, events); catkin package name is `x`
  x:
    type: git
    url: https://github.com/jpl-x/x_events.git
    version: events  # `master` there is plain upstream x without the event frontends
  rpg_dvs_ros:  # only dvs_msgs is needed
    type: git
    url: https://github.com/uzh-rpg/rpg_dvs_ros.git
    version: master
  gflags_catkin:
    type: git
    url: https://github.com/ethz-asl/gflags_catkin.git
    version: master
  glog_catkin:
    type: git
    url: https://github.com/ethz-asl/glog_catkin.git
    version: master
  eigen_catkin:
    type: git
    url: https://github.com/ethz-asl/eigen_catkin.git
    version: master
  ceres_catkin:
    type: git
    url: https://github.com/ethz-asl/ceres_catkin.git
    version: master
  # public mirror of the JPL-internal x_easy_profiler_catkin referenced by x_events/dependencies.yaml
  easy_profiler_catkin:
    type: git
    url: https://github.com/florian-world/x_easy_profiler_catkin.git
    version: master
  catkin_simple:
    type: git
    url: https://github.com/catkin/catkin_simple.git
    version: master
