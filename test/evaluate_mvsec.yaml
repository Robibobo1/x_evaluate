# MVSEC indoor_flying (https://daniilidis-group.github.io/mvsec/), left DAVIS 346 with motion-capture ground truth.
# The *_eval.bag is produced from the downloaded *_data.bag and *_gt.bag with scripts/prepare_mvsec.py, which also
# prints the initial state below.

common_params:
  eklt_bootstrap: "klt"

datasets:
 - name: MVSEC Indoor Flying 1
   rosbag: ${XVIO_DATASET_DIR}/mvsec/indoor_flying1_eval.bag
   events_topic: /davis/left/events
   image_topic: /davis/left/image_raw
   pose_topic: /davis/left/pose
   imu_topic: /davis/left/imu
   params: ${X_EVALUATE_SRC_ROOT}/params_mvsec.yaml
   from: 1504645177.5002
   override_params:
     # initial state at 1504645177.5002 from /davis/left/pose (IMU in z-up frame), sensor at rest:
     p: [-0.0017569816098946354, -0.01706440613634889, 0.005827606185952305]
     v: [0.0, 0.0, 0.0]
     q: [0.6178664369461603, -0.7848708691581351, -0.04664402126568245, 0.006566591397135069]  # [w,x,y,z]
     # resting accelerometer reads 8.83 m/s^2 instead of 9.81
     b_a: [-0.046426666121235916, 0.9519462759960238, 0.23187575959885987]
